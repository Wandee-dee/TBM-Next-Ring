<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBM Next Ring Key Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;background:#f5f5f5;color:#111;padding:16px}
h1{font-size:16px;font-weight:600;margin-bottom:16px;color:#111}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.stitle{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#888;margin:0 0 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:#666}
.field input,.field select{padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;width:100%}
.divider{height:1px;background:#f0f0f0;margin:12px 0}
.tog{display:flex;border:1px solid #ddd;border-radius:6px;overflow:hidden}
.tog button{flex:1;padding:6px 4px;font-size:12px;background:#fff;color:#666;border:none;cursor:pointer;border-right:1px solid #ddd}
.tog button:last-child{border-right:none}
.tog button.on{background:#f0f0f0;color:#111;font-weight:500}
.chip{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;font-weight:500;margin-top:5px}

/* scenario */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid #ddd;background:#fafafa;cursor:pointer;text-align:left;width:100%;transition:all .15s}
.sc-btn:hover{border-color:#999}
.sc-btn.on{border-color:#185FA5;background:#EAF2FF}
.sc-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0}
.sc-label{font-size:12px;font-weight:500;color:#111;line-height:1.3}
.sc-desc{font-size:10px;color:#888;margin-top:1px}
.sc-full{grid-column:span 2}

/* ratio panel */
.ratio-panel{display:none;margin-top:10px;padding:12px;background:#f7f9ff;border:1px solid #cce;border-radius:8px}
.ratio-panel.show{display:block}
.ratio-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ratio-block{display:flex;align-items:center;gap:6px}
.ratio-block label{font-size:12px;color:#555;white-space:nowrap;font-weight:500}
.ratio-block input{width:54px;padding:5px 7px;border:1px solid #ccc;border-radius:6px;font-size:13px}
.ratio-preview{display:flex;gap:3px;flex-wrap:wrap;margin-top:10px}
.rp-chip{display:inline-flex;align-items:center;justify-content:center;width:30px;height:22px;border-radius:4px;font-size:11px;font-weight:600}
.rp-L{background:#ddeeff;color:#185FA5}
.rp-R{background:#ffeeee;color:#993C1D}

/* candidates */
.cand-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.cand-btn{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:8px;border:1px solid #ddd;background:#fafafa;cursor:pointer;transition:all .15s}
.cand-btn:hover{border-color:#999}
.cand-btn.sc-pick{border-color:#0F6E56;background:#eaf5ee}
.cand-btn.manual{border-color:#185FA5;background:#EAF2FF}
.cand-key{font-size:13px;font-weight:700;min-width:28px}
.kL{color:#185FA5}.kR{color:#993C1D}
.cand-vals{font-size:11px;color:#666;line-height:1.5}
.star{font-size:10px;color:#0F6E56;margin-left:1px}

/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;font-weight:600;color:#888;text-align:center;padding:6px 4px;border-bottom:1px solid #eee}
th.l{text-align:left}
td{padding:6px 4px;text-align:center;border-bottom:1px solid #f0f0f0;font-variant-numeric:tabular-nums}
td.l{text-align:left;font-weight:500}
tr:last-child td{border-bottom:none}
tr.hi td{background:#f7f7f7}
.kb{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 6px;border-radius:4px;font-weight:700;font-size:12px}
.kbL{background:#ddeeff;color:#185FA5}
.kbR{background:#ffeeee;color:#993C1D}
.vg{color:#0F6E56;font-weight:500}
.vy{color:#8B6914;font-weight:500}
.vr{color:#A32D2D;font-weight:500}
.chart-wrap{margin-top:12px;height:110px}
</style>
</head>
<body>
<h1>TBM Next Ring Key Calculator</h1>

<div class="card">
  <p class="stitle">Current ring</p>
  <div class="g3">
    <div class="field"><label>Current key</label><select id="currentKey"></select></div>
    <div class="field"><label>H lead (mm)</label><input type="number" id="hLead" value="12" step="0.1"></div>
    <div class="field"><label>V plumb (mm)</label><input type="number" id="vPlumb" value="15" step="0.1"></div>
  </div>

  <div class="divider"></div>
  <p class="stitle">Horizontal curve</p>
  <div class="g2">
    <div class="field"><label>Direction</label>
      <div class="tog" id="hDirTog">
        <button class="on" data-v="straight" onclick="setDir(this,'h')">Straight</button>
        <button data-v="right" onclick="setDir(this,'h')">Right</button>
        <button data-v="left" onclick="setDir(this,'h')">Left</button>
      </div>
    </div>
    <div class="field" id="hRF" style="opacity:.4"><label>H radius (m)</label>
      <input type="number" id="hR" value="1000" step="50" min="1" disabled>
    </div>
  </div>
  <div id="hChip"></div>

  <div class="divider"></div>
  <p class="stitle">Vertical curve</p>
  <div class="g2">
    <div class="field"><label>Curve type</label>
      <div class="tog" id="vTypeTog">
        <button class="on" data-v="straight" onclick="setDir(this,'v')">Straight</button>
        <button data-v="sag" onclick="setDir(this,'v')">Sag ↑ (หงาย)</button>
        <button data-v="crest" onclick="setDir(this,'v')">Crest ↓ (คว่ำ)</button>
      </div>
    </div>
    <div class="field" id="vRF" style="opacity:.4"><label>V radius Rv (m)</label>
      <input type="number" id="vR" value="3000" step="100" min="100" disabled>
    </div>
  </div>
  <div id="vChip"></div>
</div>

<div class="card">
  <p class="stitle">Forecast scenario</p>
  <div class="sc-grid">
    <button class="sc-btn on" data-sc="auto" onclick="setSc(this)">
      <span class="sc-icon">⭐</span>
      <span><span class="sc-label">Best auto</span><br><span class="sc-desc">เลือก key ที่ดีที่สุด</span></span>
    </button>
    <button class="sc-btn" data-sc="prefL" onclick="setSc(this)">
      <span class="sc-icon">🔵</span>
      <span><span class="sc-label">เน้น L keys</span><br><span class="sc-desc">เลือก L ก่อนเสมอ</span></span>
    </button>
    <button class="sc-btn" data-sc="prefR" onclick="setSc(this)">
      <span class="sc-icon">🔴</span>
      <span><span class="sc-label">เน้น R keys</span><br><span class="sc-desc">เลือก R ก่อนเสมอ</span></span>
    </button>
    <button class="sc-btn" data-sc="altLR" onclick="setSc(this)">
      <span class="sc-icon">🔄</span>
      <span><span class="sc-label">สลับ L-R ทุก ring</span><br><span class="sc-desc">L→R→L→R...</span></span>
    </button>
    <button class="sc-btn" data-sc="minH" onclick="setSc(this)">
      <span class="sc-icon">↔️</span>
      <span><span class="sc-label">เน้น H lead</span><br><span class="sc-desc">ลด H ก่อน ไม่สน V</span></span>
    </button>
    <button class="sc-btn" data-sc="minV" onclick="setSc(this)">
      <span class="sc-icon">↕️</span>
      <span><span class="sc-label">เน้น V plumb</span><br><span class="sc-desc">ลด V ก่อน ไม่สน H</span></span>
    </button>
    <button class="sc-btn sc-full" data-sc="ratio" onclick="setSc(this)">
      <span class="sc-icon">⚖️</span>
      <span><span class="sc-label">Custom L:R ratio</span><br><span class="sc-desc">กำหนดเองว่าจะใช้ L กี่ ring แล้วสลับ R กี่ ring</span></span>
    </button>
  </div>

  <div class="ratio-panel" id="ratioPanel">
    <div class="ratio-row">
      <div class="ratio-block">
        <label style="color:#185FA5">L</label>
        <input type="number" id="ratioL" value="2" min="1" max="20" oninput="update()">
        <label>rings</label>
      </div>
      <span style="font-size:14px;color:#888">→</span>
      <div class="ratio-block">
        <label style="color:#993C1D">R</label>
        <input type="number" id="ratioR" value="1" min="1" max="20" oninput="update()">
        <label>rings → repeat</label>
      </div>
    </div>
    <div class="ratio-preview" id="ratioPreview"></div>
  </div>
</div>

<div class="card">
  <p class="stitle" id="candTitle">Next ring candidates</p>
  <div class="cand-grid" id="candGrid"></div>
</div>

<div class="card">
  <p class="stitle" id="fcTitle">10-ring forecast</p>
  <table>
    <thead>
      <tr>
        <th class="l">Ring</th>
        <th>Key used</th>
        <th>Next key</th>
        <th>Proj H lead</th>
        <th>Proj V plumb</th>
      </tr>
    </thead>
    <tbody id="fcBody"></tbody>
  </table>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>

<script>
const W=1400;
const KEYS={L1:{h:55.43,v:22.96},L2:{h:42.43,v:42.43},L3:{h:22.96,v:55.43},L4:{h:0,v:60},L5:{h:-22.96,v:55.43},L6:{h:-42.43,v:42.43},L12:{h:0,v:-60},L13:{h:22.96,v:-55.43},L14:{h:42.43,v:-42.43},L15:{h:55.43,v:-22.96},L16:{h:60,v:0},R1:{h:-55.43,v:22.96},R2:{h:-60,v:0},R3:{h:-55.43,v:-22.96},R4:{h:-42.43,v:-42.43},R5:{h:-22.96,v:-55.43},R6:{h:0,v:-60},R12:{h:42.43,v:42.43},R13:{h:22.96,v:55.43},R14:{h:0,v:60},R15:{h:-22.96,v:55.43},R16:{h:-42.43,v:42.43}};
const NEXT={L1:['L3','L15','R3','R15','L6','L12','R6','R12'],L2:['L4','L16','R4','R16','L13','R13'],L3:['L5','L14','L1','R5','R14','R1'],L4:['L15','L2','R15','R2','L6','L12','R6','R12'],L5:['L16','L3','R16','R3','L13','R13'],L6:['L1','L4','L14','R1','R4','R14'],L12:['L14','L1','L4','R14','R1','R4'],L13:['L15','L2','L5','R15','R2','R5'],L14:['L16','L3','R16','R3','L6','L12','R6','R12'],L15:['L1','L4','R1','R4','L13','R13'],L16:['L2','L5','L14','R2','R5','R14'],R1:['L3','L15','R3','R15','L6','L12','R6','R12'],R2:['L4','L16','R4','R16','L13','R13'],R3:['L5','L14','L1','R5','R14','R1'],R4:['L15','L2','R15','R2','L6','L12','R6','R12'],R5:['L16','L3','R16','R3','L13','R13'],R6:['L1','L4','L14','R1','R4','R14'],R12:['L14','L1','L4','R14','R1','R4'],R13:['L15','L2','L5','R15','R2','R5'],R14:['L16','L3','R16','R3','L6','L12','R6','R12'],R15:['L1','L4','R1','R4','L13','R13'],R16:['L2','L5','L14','R2','R5','R14']};

let hDir='straight',vDir='straight',sc='auto',overrideKey=null,chart=null;

const keyEl=document.getElementById('currentKey');
Object.keys(KEYS).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;if(k==='R4')o.selected=true;keyEl.appendChild(o);});

function setSc(btn){
  document.querySelectorAll('.sc-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');sc=btn.dataset.sc;
  document.getElementById('ratioPanel').classList.toggle('show',sc==='ratio');
  overrideKey=null;update();
}
function setDir(btn,axis){
  const id=axis==='h'?'hDirTog':'vTypeTog';
  document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(axis==='h'){hDir=btn.dataset.v;const d=hDir==='straight';document.getElementById('hRF').style.opacity=d?'.4':'1';document.getElementById('hR').disabled=d;}
  else{vDir=btn.dataset.v;const d=vDir==='straight';document.getElementById('vRF').style.opacity=d?'.4':'1';document.getElementById('vR').disabled=d;}
  overrideKey=null;update();
}
function fmt(v){return(v>=0?'+':'')+v.toFixed(2);}
function dc(v){const a=Math.abs(v);return a<15?'vg':a<40?'vy':'vr';}
function calcOff(R){return 6300*W/(R*1000);}
function kb(k){return`<span class="kb ${k.startsWith('L')?'kbL':'kbR'}">${k}</span>`;}

function ratioPattern(n){
  const nL=Math.max(1,parseInt(document.getElementById('ratioL').value)||2);
  const nR=Math.max(1,parseInt(document.getElementById('ratioR').value)||1);
  const cyc=nL+nR,pat=[];
  for(let i=0;i<n;i++) pat.push((i%cyc)<nL?'L':'R');
  return pat;
}

function pickKey(fromKey,hOff,vOff,cH,cV,scenario,idx){
  const cands=NEXT[fromKey]||[];
  if(!cands.length)return null;
  const scored=cands.map(k=>{
    const s=KEYS[k],pH=cH+hOff+s.h,pV=cV+vOff+s.v;
    return{key:k,projH:pH,projV:pV,isL:k.startsWith('L'),sa:Math.abs(pH)+Math.abs(pV),sh:Math.abs(pH),sv:Math.abs(pV)};
  });
  let pool=scored;
  if(scenario==='prefL'){const p=scored.filter(x=>x.isL);pool=p.length?p:scored;}
  else if(scenario==='prefR'){const p=scored.filter(x=>!x.isL);pool=p.length?p:scored;}
  else if(scenario==='altLR'){const wL=(idx%2===0);const p=scored.filter(x=>x.isL===wL);pool=p.length?p:scored;}
  else if(scenario==='ratio'){const pat=ratioPattern(idx+1);const wL=pat[idx]==='L';const p=scored.filter(x=>x.isL===wL);pool=p.length?p:scored;}
  if(scenario==='minH')return pool.reduce((a,b)=>a.sh<=b.sh?a:b);
  if(scenario==='minV')return pool.reduce((a,b)=>a.sv<=b.sv?a:b);
  return pool.reduce((a,b)=>a.sa<=b.sa?a:b);
}

function scLabel(){
  const m={auto:'Best auto',prefL:'เน้น L keys',prefR:'เน้น R keys',altLR:'สลับ L-R',minH:'เน้น H lead',minV:'เน้น V plumb'};
  if(sc==='ratio'){const nL=parseInt(document.getElementById('ratioL').value)||2;const nR=parseInt(document.getElementById('ratioR').value)||1;return`L×${nL} : R×${nR}`;}
  return m[sc]||sc;
}

function update(){
  const hLead=parseFloat(document.getElementById('hLead').value)||0;
  const vPlumb=parseFloat(document.getElementById('vPlumb').value)||0;
  const curKey=document.getElementById('currentKey').value;
  const hRv=parseFloat(document.getElementById('hR').value)||1000;
  const vRv=parseFloat(document.getElementById('vR').value)||3000;

  const hMag=hDir==='straight'?0:calcOff(hRv);
  const vMag=vDir==='straight'?0:calcOff(vRv);
  const hOff=hDir==='right'?hMag:hDir==='left'?-hMag:0;
  const vOff=vDir==='sag'?vMag:vDir==='crest'?-vMag:0;

  document.getElementById('hChip').innerHTML=hDir==='straight'
    ?'<span class="chip" style="background:#f0f0f0;color:#666">No H curve offset</span>'
    :`<span class="chip" style="${hDir==='right'?'background:#ddeeff;color:#185FA5':'background:#ffeeee;color:#993C1D'}">${hDir==='right'?'Right':'Left'} R=${hRv}m → ${fmt(hOff)} mm/ring</span>`;
  document.getElementById('vChip').innerHTML=vDir==='straight'
    ?'<span class="chip" style="background:#f0f0f0;color:#666">No V curve offset</span>'
    :`<span class="chip" style="${vDir==='sag'?'background:#eaf5ee;color:#0F6E56':'background:#ffeeee;color:#993C1D'}">${vDir==='sag'?'Sag ↑':'Crest ↓'} Rv=${vRv}m → ${fmt(vOff)} mm/ring</span>`;

  // ratio preview
  if(sc==='ratio'){
    const pat=ratioPattern(10);
    document.getElementById('ratioPreview').innerHTML=pat.map((t,i)=>`<span class="rp-chip rp-${t}">${t}${i+1}</span>`).join('');
  }

  // candidates
  const cands=NEXT[curKey]||[];
  const scPick=pickKey(curKey,hOff,vOff,hLead,vPlumb,sc,0);
  const scKey=scPick?scPick.key:null;
  if(overrideKey&&!cands.includes(overrideKey))overrideKey=null;
  const chosen=overrideKey||scKey;

  document.getElementById('candTitle').textContent=`Next ring candidates — ${chosen||'—'} ${overrideKey?'(manual)':'('+scLabel()+')'}`;
  document.getElementById('fcTitle').textContent=`10-ring forecast — ${scLabel()}`;

  const grid=document.getElementById('candGrid');
  grid.innerHTML='';
  cands.forEach(k=>{
    const seg=KEYS[k],pH=hLead+hOff+seg.h,pV=vPlumb+vOff+seg.v;
    const isPick=k===scKey,isChosen=k===chosen;
    const btn=document.createElement('button');
    btn.className='cand-btn'+(isChosen?(isPick?' sc-pick':' manual'):'');
    btn.innerHTML=`<span class="cand-key ${k.startsWith('L')?'kL':'kR'}">${k}${isPick?'<span class="star">★</span>':''}</span><span class="cand-vals">H: ${fmt(pH)}<br>V: ${fmt(pV)}</span>`;
    btn.onclick=()=>{overrideKey=(overrideKey===k?null:k);update();};
    grid.appendChild(btn);
  });

  // forecast
  const rows=[];
  let cH=hLead,cV=vPlumb,key=curKey;
  for(let i=0;i<10;i++){
    let res;
    if(i===0&&chosen){const s=KEYS[chosen];res={key:chosen,projH:cH+hOff+s.h,projV:cV+vOff+s.v};}
    else res=pickKey(key,hOff,vOff,cH,cV,sc,i);
    if(!res)break;
    rows.push({ring:i,usedKey:key,nextKey:res.key,projH:res.projH,projV:res.projV});
    key=res.key;cH=res.projH;cV=res.projV;
  }

  const tbody=document.getElementById('fcBody');
  tbody.innerHTML='';
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    if(i===0)tr.className='hi';
    tr.innerHTML=`<td class="l">+${r.ring+1}</td><td>${kb(r.usedKey)}</td><td>${kb(r.nextKey)}</td><td class="${dc(r.projH)}">${fmt(r.projH)}</td><td class="${dc(r.projV)}">${fmt(r.projV)}</td>`;
    tbody.appendChild(tr);
  });

  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('chart'),{
    type:'line',
    data:{
      labels:rows.map(r=>'+' +(r.ring+1)),
      datasets:[
        {label:'Proj H lead',data:rows.map(r=>+r.projH.toFixed(2)),borderColor:'#185FA5',borderWidth:2,pointRadius:3,tension:0.3,fill:false},
        {label:'Proj V plumb',data:rows.map(r=>+r.projV.toFixed(2)),borderColor:'#0F6E56',borderWidth:2,pointRadius:3,tension:0.3,fill:false}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{font:{size:11},boxWidth:12}}},scales:{x:{ticks:{font:{size:10}}},y:{ticks:{font:{size:10}},title:{display:true,text:'mm',font:{size:10}}}}}
  });
}

['hLead','vPlumb','hR','vR','currentKey'].forEach(id=>{
  const el=document.getElementById(id);
  if(el){el.addEventListener('input',()=>{overrideKey=null;update();});el.addEventListener('change',()=>{overrideKey=null;update();});}
});
update();
</script>
</body>
</html>
